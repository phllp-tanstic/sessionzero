[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionzero"
version = "0.1.0"
description = "SessionZero market-data and PostgreSQL persistence foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "exchange-calendars==4.13.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.16.7",
]

[project.scripts]
sessionzero-verify-bitget = "sessionzero_bitget.verify:main"
sessionzero-export-bitget-history = "sessionzero_bitget.export:main"
sessionzero-ingest-bitget-history = "sessionzero_database.cli:main"
sessionzero-ingest-bitget-reference = "sessionzero_database.reference_cli:main"
sessionzero-collector = "sessionzero_collector.main:main"

[tool.setuptools.packages.find]
where = ["packages/bitget", "packages/schemas", "packages/config", "packages/database", "packages/market_data", "services/api", "services/collector"]

[tool.setuptools.package-data]
sessionzero_market_data = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "postgres: tests that require a PostgreSQL DATABASE_URL",
  "live: opt-in tests that call an external provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
